name: OpenAI Agents API

on:
  pull_request:
    paths:
      - 'openai/**'
      - '.github/workflows/openai-agents-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-agents-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: openai/agents-api tests
    runs-on: ubuntu-24.04-4core
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - uses: actions/cache/restore@v5
        id: nm-cache
        with:
          path: |
            node_modules
            openai/*/node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - run: npm ci --prefer-offline --no-audit --no-fund
        if: steps.nm-cache.outputs.cache-hit != 'true'

      - name: Executor tests
        run: npm test -w cloudflare-openai-agents-api-executor
