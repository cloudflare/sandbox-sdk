name: OpenAI Agents API

on:
  pull_request:
    paths:
      - "openai/**"
      - ".github/workflows/openai-agents-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-agents-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: openai/agents-api tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: openai/agents-api
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: openai/agents-api/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test
