name: Cleanup

# GitHub runs pull_request_target and scheduled workflows only from the default branch, so this
# maintenance branch cleans up on pull_request. That gives secrets only to PRs from branches in
# this repository, which are the only PRs whose privileged CI deploys anything.
on:
  pull_request:
    branches: [v0]
    types: [closed]

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  # --- PR close: worker/container cleanup ---
  # Only deletes resources keyed by PR number, never executes PR code.
  #
  # Image tags (pr-* and ci-*) are NOT deleted here. Deleting pr-* tags was
  # observed to break the ci-* content-addressed Docker cache, likely because
  # they share underlying manifests and deletion triggers GC.
  cleanup-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Delete GHA caches
        timeout-minutes: 1
        continue-on-error: true
        run: gh cache delete --all --ref "refs/pull/${{ github.event.pull_request.number }}/merge" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete test workers and containers
        timeout-minutes: 3
        continue-on-error: true
        run: |
          PR=${{ github.event.pull_request.number }}
          CONTAINERS=$(wrangler containers list --json 2>/dev/null || echo "[]")

          WORKER="sandbox-e2e-test-worker-pr-${PR}"
          IDS=$(echo "$CONTAINERS" | jq -r ".[] | select(.name == \"$WORKER\" or (.name | startswith(\"$WORKER-\"))) | .id" 2>/dev/null)
          wrangler delete --name "$WORKER" 2>/dev/null || true
          for id in $IDS; do
            wrangler containers delete "$id" 2>/dev/null || true
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
