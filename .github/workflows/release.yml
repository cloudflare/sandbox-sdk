# Publishes @cloudflare/sandbox and its shim donor image. See docs/releasing.md.
# npm trusted publishing names this file, so keep the name release.yml.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release. It must equal the version in packages/sandbox/package.json.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.repository == 'cloudflare/sandbox-sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Pushes the release tag.
      contents: write
      # npm trusted publishing and provenance.
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      PACKAGE: "@cloudflare/sandbox"
      IMAGE: docker.io/cloudflare/sandbox
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11

      - name: Check the version
        run: |
          actual="$(node -p "require('./packages/sandbox/package.json').version")"
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::packages/sandbox/package.json has version $actual, not $VERSION"
            exit 1
          fi
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$PACKAGE@$VERSION is already on npm"
            exit 1
          fi

      - run: npm ci --no-audit --no-fund

      - name: Check
        run: npm run check

      - name: Test
        run: npm run test:release

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # The image goes first, so a published package always has its donor image. The default
      # builder reuses the shim that the checks built and tested, instead of compiling it again.
      - name: Push the donor image
        run: |
          docker buildx build --platform linux/amd64 --target image \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:$VERSION" --push \
            --file images/sandbox-tools/Dockerfile .

      - name: Publish to npm
        run: |
          case "$VERSION" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish --workspace packages/sandbox --provenance --access public --tag "$dist_tag"

      - name: Tag the release
        run: |
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag --annotate --message "$PACKAGE@$VERSION" "$PACKAGE@$VERSION"
          git push origin "refs/tags/$PACKAGE@$VERSION"

      - name: Update the Docker Hub description
        if: ${{ !contains(inputs.version, '-') }}
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: cloudflare/sandbox
          short-description: The sandbox-shim helper for @cloudflare/sandbox, to copy into your own image
          readme-filepath: images/sandbox-tools/DOCKER_HUB.md
