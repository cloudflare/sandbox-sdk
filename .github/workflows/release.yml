name: Release

on:
  push:
    branches:
      - main
      - next

permissions:
  id-token: write
  contents: write
  pull-requests: write
  packages: write

env:
  CF_ACCOUNT_SUBDOMAIN: sandbox-sdk-ci

concurrency:
  group: release-refs/heads/main
  cancel-in-progress: false

jobs:
  # --- Prerelease channels ---
  prerelease:
    if: ${{ github.repository_owner == 'cloudflare' && github.ref == 'refs/heads/next' }}
    uses: ./.github/workflows/reusable-prerelease.yml
    permissions:
      id-token: write
      contents: read
      actions: read
      pull-requests: read
      packages: write
    with:
      channel: next
      prerelease_identifier: next
      base_bump: minor
      worker_name_prefix: sandbox-e2e-test-worker-next
      publish_docker_alias: true
    secrets: inherit

  # --- Resolve the immutable release identity for this run ---
  release-identity:
    if: ${{ github.repository_owner == 'cloudflare' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      release-sha: ${{ steps.identity.outputs.release-sha }}
      release-mode: ${{ steps.identity.outputs.release-mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Resolve release identity
        id: identity
        run: |
          version="$(node -p "require('./packages/sandbox/package.json').version")"
          npx tsx .github/release-identity.ts stable \
            --version "$version" \
            --selector "${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # --- Compute content hashes for stable releases ---
  hashes:
    needs: release-identity
    if: ${{ github.repository_owner == 'cloudflare' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 1
    outputs:
      docker: ${{ steps.compute.outputs.docker }}
      deploy: ${{ steps.compute.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-identity.outputs.release-sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Compute content hashes
        id: compute
        run: |
          echo "docker=${{ hashFiles(
            'packages/sandbox/Dockerfile',
            'docker-bake.hcl',
            'docker-images.txt',
            '.dockerignore',
            'package-lock.json',
            'package.json',
            'turbo.json',
            'packages/*/package.json',
            'packages/shared/**',
            'packages/sandbox-container/**',
            'tooling/typescript-config/**',
            'biome.json',
            '.bun-version',
            'tests/e2e/test-worker/Dockerfile.*'
          ) }}" >> "$GITHUB_OUTPUT"
          echo "deploy=${{ hashFiles(
            'packages/sandbox/Dockerfile',
            'docker-bake.hcl',
            'docker-images.txt',
            '.dockerignore',
            'package-lock.json',
            'package.json',
            'turbo.json',
            'packages/*/package.json',
            'packages/shared/**',
            'packages/sandbox-container/**',
            'tooling/typescript-config/**',
            'biome.json',
            '.bun-version',
            'tests/e2e/test-worker/Dockerfile.*',
            'packages/sandbox/src/**',
            'tests/e2e/test-worker/**',
            'vitest.e2e.config.ts',
            '.github/workflows/release.yml',
            '.github/workflows/reusable-e2e.yml'
          ) }}" >> "$GITHUB_OUTPUT"

  # --- Build (always runs everything on stable release) ---
  build:
    needs: [release-identity, hashes]
    if: ${{ github.repository_owner == 'cloudflare' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      skip_docker: false
      image_tag: main
      docker_hash: ${{ needs.hashes.outputs.docker }}
      checkout_ref: ${{ needs.release-identity.outputs.release-sha }}
      artifact_key: ${{ needs.release-identity.outputs.release-sha }}
    secrets: inherit

  # --- Quality gates (all checks on release) ---
  quality:
    needs: [release-identity, build]
    if: ${{ github.repository_owner == 'cloudflare' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/reusable-quality.yml
    with:
      run_sdk_tests: true
      run_container_tests: true
      run_changeset_validation: false
      checkout_ref: ${{ needs.release-identity.outputs.release-sha }}
      artifact_key: ${{ needs.release-identity.outputs.release-sha }}
    secrets: inherit

  # --- E2E tests ---
  e2e:
    needs: [release-identity, hashes, build]
    if: ${{ github.repository_owner == 'cloudflare' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      worker_name_prefix: sandbox-e2e-test-worker-main
      image_tag: ci-${{ needs.hashes.outputs.docker }}
      deploy_hash: ${{ needs.hashes.outputs.deploy }}
      checkout_ref: ${{ needs.release-identity.outputs.release-sha }}
      artifact_key: ${{ needs.release-identity.outputs.release-sha }}
    secrets: inherit

  # --- Publish release (after all gates pass) ---
  publish-release:
    needs: [release-identity, hashes, build, quality, e2e]
    if: ${{ github.repository_owner == 'cloudflare' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - uses: actions/cache/restore@v5
        id: nm-cache
        with:
          path: |
            node_modules
            packages/*/node_modules
            examples/*/node_modules
            sites/*/node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - run: npm ci --prefer-offline --no-audit --no-fund
        if: steps.nm-cache.outputs.cache-hit != 'true'

      - uses: actions/download-artifact@v8
        id: download-build
        continue-on-error: true
        with:
          name: build-${{ needs.release-identity.outputs.release-sha }}
          path: packages

      - name: Ensure build artifact is present
        if: steps.download-build.outcome == 'failure'
        run: |
          echo "::error title=Build artifact unavailable::Artifact build-${{ needs.release-identity.outputs.release-sha }} is missing (expired or never uploaded). Re-run the entire Release workflow from this commit so hashes, build, quality, e2e, and publish run together; re-running only publish-release cannot recover an expired artifact."
          exit 1

      - name: Install crane
        run: .github/install-crane.sh

      - name: Login to registries
        run: .github/login-release-registries.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create release source worktree
        id: release-src
        run: |
          release_sha="${{ needs.release-identity.outputs.release-sha }}"
          worktree="$RUNNER_TEMP/release-src"
          git worktree add --detach "$worktree" "$release_sha"
          cp -R packages/sandbox/dist "$worktree/packages/sandbox/dist"
          cp -R packages/shared/dist "$worktree/packages/shared/dist"
          echo "path=$worktree" >> "$GITHUB_OUTPUT"

      - name: Detect pending changesets
        id: pending-changesets
        run: |
          shopt -s nullglob
          files=()
          for file in .changeset/*.md; do
            if [[ "$file" == ".changeset/README.md" ]]; then
              continue
            fi
            files+=("$file")
          done
          if [[ ${#files[@]} -gt 0 ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish stable release
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # github-actions token can create releases; app token is used later for PRs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          npx tsx .github/release-orchestrator.ts stable \
            --version "${{ needs.build.outputs.version }}" \
            --source-tag "ci-${{ needs.hashes.outputs.docker }}" \
            --commit-sha "${{ needs.release-identity.outputs.release-sha }}" \
            --release-root "${{ steps.release-src.outputs.path }}" \
            --mode "${{ needs.release-identity.outputs.release-mode }}"

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: cloudflare/sandbox
          readme-filepath: ./DOCKER_README.md
          short-description: ${{ github.event.repository.description }}

      - name: Promote public references
        id: promotion
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          result="$(npx tsx .github/promote-references.ts \
            --version "${{ needs.build.outputs.version }}" \
            --main-sha "${{ github.sha }}")"
          echo "$result"
          if grep -q 'promotion_result=pr-created' <<< "$result"; then
            echo "result=pr-created" >> "$GITHUB_OUTPUT"
          else
            echo "result=no-edits" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop after promotion PR
        if: steps.promotion.outputs.result == 'pr-created'
        run: echo "Promotion PR created or updated; Changesets will run after the PR merges to main."

      - name: Remove release worktree
        if: always()
        run: |
          if [ -n "${{ steps.release-src.outputs.path }}" ]; then
            git worktree remove --force "${{ steps.release-src.outputs.path }}" || true
          fi

      - name: Prepare next release
        id: changesets
        if: steps.pending-changesets.outputs.present == 'true' && steps.promotion.outputs.result == 'no-edits'
        uses: changesets/action@v1
        with:
          version: npx tsx .github/changeset-version.ts
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
