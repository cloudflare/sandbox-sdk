[package]
name = "sandbox-tools"
version = "1.0.0-rc.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ignore = "0.4"
tar = { version = "0.4", default-features = false }
zstd = { version = "0.13", default-features = false, features = ["zstdmt"] }

[[bin]]
name = "sandbox-shim"
path = "src/main.rs"
